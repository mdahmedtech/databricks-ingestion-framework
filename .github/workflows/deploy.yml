name: deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "sample_data/**"
  workflow_dispatch:

env:
  DATABRICKS_HOST: https://dbc-b6c519c3-97eb.cloud.databricks.com
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_GITHUB_ACTION }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t dev
      - run: databricks bundle validate -t prod

  deploy-dev:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - uses: databricks/setup-cli@main
      - run: bash scripts/deploy_dev.sh
    
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
      - name: Ensure Terraform state bucket exists
        run: |
          BUCKET=databricks-ingestion-terraform-state
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
          fi
      - run: terraform -chdir=infra/backup init
      - run: terraform -chdir=infra/backup fmt -check
      - run: terraform -chdir=infra/backup validate
      - run: terraform -chdir=infra/backup plan
      - if: github.event_name == 'push'
        run: terraform -chdir=infra/backup apply -auto-approve
  deploy-prod:
    needs: [deploy-dev, terraform]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - uses: databricks/setup-cli@main
      - run: bash scripts/deploy_prod.sh
