name: deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [dev, uat, prod]
        default: dev

env:
  DATABRICKS_HOST: https://dbc-b6c519c3-97eb.cloud.databricks.com
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_GITHUB_ACTION }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t dev

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t ${{ inputs.target || 'dev' }}
      - run: databricks bundle deploy -t ${{ inputs.target || 'dev' }}
      - run: databricks bundle run -t ${{ inputs.target || 'dev' }} medallion_pipeline
