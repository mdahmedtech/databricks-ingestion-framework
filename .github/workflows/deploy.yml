name: deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "sample_data/**"
  workflow_dispatch:

env:
  DATABRICKS_HOST: https://dbc-b6c519c3-97eb.cloud.databricks.com
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_GITHUB_ACTION }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t dev
      - run: databricks bundle validate -t prod

  deploy-dev:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - uses: databricks/setup-cli@main
      - run: bash scripts/deploy_dev.sh

  deploy-prod:
    needs: deploy-dev
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - uses: databricks/setup-cli@main
      - run: bash scripts/deploy_prod.sh
