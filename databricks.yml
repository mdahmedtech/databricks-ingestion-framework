bundle:
  name: databricks_ingestion_framework

include:
  - resources/*.yml

artifacts:
  ingestion_wheel:
    type: whl
    build: python -m build --wheel
    path: .

sync:
  exclude:
    - infra/**
    - tests/**
    - .idea/**

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-b6c519c3-97eb.cloud.databricks.com

  uat:
    workspace:
      host: https://dbc-b6c519c3-97eb.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/uat

  prod:
    workspace:
      host: https://dbc-b6c519c3-97eb.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod